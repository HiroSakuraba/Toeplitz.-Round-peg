name: Toeplitz research exact checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rational-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact-rational regression suite
        run: python -m unittest discover -s tests -v
      - name: Audit v212 periodic counterexample
        run: python code/periodic_bridge_v212.py
      - name: Audit v213 periodic-lift counterexample
        run: python code/periodic_square_cert_v213.py
      - name: Audit v214 relative degree
        run: python code/relative_degree_v214.py
      - name: Audit v215 knot-robust relative degree
        run: python code/relative_degree_v215.py
      - name: Audit v216 boundary-only degree and polygon selection
        run: python code/boundary_degree_v216.py
      - name: Audit v217 multiscale relative-degree ledger
        run: python code/multiscale_degree_v217.py
      - name: Verify original ZIP archives
        run: sha256sum --check archive/SHA256SUMS.txt
