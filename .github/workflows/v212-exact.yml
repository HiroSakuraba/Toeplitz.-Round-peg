name: Toeplitz research exact checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rational-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact-rational regression suite
        run: python -m unittest discover -s tests -v
      - name: Audit v212 periodic counterexample
        run: python code/periodic_bridge_v212.py
      - name: Audit v213 periodic-lift counterexample
        run: python code/periodic_square_cert_v213.py
      - name: Audit v214 relative degree
        run: python code/relative_degree_v214.py
      - name: Audit v215 knot-robust relative degree
        run: python code/relative_degree_v215.py
      - name: Audit v216 boundary-only degree and polygon selection
        run: python code/boundary_degree_v216.py
      - name: Audit v217 multiscale relative-degree ledger
        run: python code/multiscale_degree_v217.py
      - name: Audit v218 cyclic sign, six sectors and collision strata
        run: python code/configuration_symmetry_v218.py
      - name: Audit v219 quotient and collision link
        run: python code/collision_quotient_v219.py
      - name: Audit v220 fixed-curve collision-link obstruction
        run: python code/accumulating_notches_v220.py
      - name: Audit v221 positive-size cutoff incidence
        run: python code/cutoff_incidence_v221.py
      - name: Audit v222 multibranch PL incidence
        run: python code/multibranch_incidence_v222.py
      - name: Audit v223 complete single-polygon square-orbit census
        run: python code/polygon_orbit_census_v223.py
      - name: Audit v224 moving polygon algebraic events
        run: python code/moving_polygon_events_v224.py
      - name: Audit v225 persistent edge strata
        run: python code/persistent_strata_v225.py
      - name: Audit v226 exact algebraic clustering and geometric orbit chambers
        run: python code/algebraic_orbit_events_v226.py
      - name: Audit v227 local algebraic orbit germs
        run: python code/local_orbit_germs_v227.py
      - name: Audit v228 algebraic singular event-slice feasibility
        run: python code/singular_event_feasibility_v228.py
      - name: Audit v229 singular Cramer branch continuation
        run: python code/singular_continuation_v229.py
      - name: Audit v230 irregular power-spiral thresholds and conditional bound
        run: python code/irregular_spiral_frontier_v230.py
      - name: Audit v231 blind spiral search and exact four-arc degree certificates
        run: python code/spiral_pruned_v231.py
      - name: Audit v232 multi-candidate search and exact C0 phase perturbation degree
        run: python code/spiral_multicandidate_v232.py
      - name: Replay v233 mixed-power spiral square certificates
        run: python code/mixed_power_spiral_v233.py
      - name: Audit v236 square-free logarithmic spiral exclusion
        run: python code/log_spiral_exclusion_v236.py
      - name: Audit v238 improved open log spiral exclusion
        run: python code/log_spiral_exclusion_v238.py
      - name: Audit v239 improved log spiral exclusion (a >= 9/10)
        run: python code/log_spiral_exclusion_v239.py
      - name: Audit v240 stronger open log spiral exclusion (a >= 17/20)
        run: python code/log_spiral_exclusion_v240.py
      - name: Verify original ZIP archives
        run: sha256sum --check archive/SHA256SUMS.txt
