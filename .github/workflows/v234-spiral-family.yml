name: SageMath v234 spiral family

on:
  pull_request:
    paths:
      - 'code/spiral_family_v234.py'
      - 'code/mixed_power_spiral_v233.py'
      - 'code/spiral_multicandidate_v232.py'
      - 'code/spiral_pruned_v231.py'
      - 'research/v234-*'
      - '.github/workflows/v234-spiral-family.yml'
  push:
    branches: [main]
    paths:
      - 'code/spiral_family_v234.py'
      - 'code/mixed_power_spiral_v233.py'
      - 'code/spiral_multicandidate_v232.py'
      - 'code/spiral_pruned_v231.py'
      - 'research/v234-*'
      - '.github/workflows/v234-spiral-family.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Replay the complete coefficient cover
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --workdir /work --env PYTHONDONTWRITEBYTECODE=1 --entrypoint /usr/bin/sage \
            sagemath/sagemath:10.10 -c \
            "import runpy, sys; sys.path.insert(0, 'code'); sys.argv[:] = ['code/spiral_family_v234.py']; runpy.run_path(sys.argv[0], run_name='__main__')"
