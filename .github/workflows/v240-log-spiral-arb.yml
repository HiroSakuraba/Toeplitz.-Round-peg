name: v240 log-spiral classification (Arb)

on:
  pull_request:
    paths:
      - 'code/log_spiral_classification_v240.py'
      - 'tests/test_log_spiral_classification_v240.py'
      - 'research/v240-*'
      - '.github/workflows/v240-log-spiral-arb.yml'
  push:
    branches: [main]
    paths:
      - 'code/log_spiral_classification_v240.py'
      - 'tests/test_log_spiral_classification_v240.py'
      - 'research/v240-*'
      - '.github/workflows/v240-log-spiral-arb.yml'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Arb bindings
        run: python -m pip install 'python-flint>=0.6,<1' 'mpmath>=1.2,<2'
      - name: Run the full classification certificate (fails closed)
        run: python code/log_spiral_classification_v240.py
      - name: v240 tests with dependencies required (no silent skips)
        env:
          REQUIRE_SPIRAL_AUDIT_DEPS: '1'
        run: python -m unittest -v tests.test_log_spiral_classification_v240
