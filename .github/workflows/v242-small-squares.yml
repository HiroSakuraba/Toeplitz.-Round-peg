name: v242 small-squares hunt (numerical replay)

on:
  pull_request:
    paths:
      - 'code/small_squares_hunt_v242.py'
      - 'tests/test_small_squares_hunt_v242.py'
      - 'research/v242-*'
      - '.github/workflows/v242-small-squares.yml'
  push:
    branches: [main]
    paths:
      - 'code/small_squares_hunt_v242.py'
      - 'tests/test_small_squares_hunt_v242.py'
      - 'research/v242-*'
      - '.github/workflows/v242-small-squares.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Replay checks (finder validation, floor shape, resolution trap, recorded minimum)
        run: python code/small_squares_hunt_v242.py
      - name: v242 tests with dependencies required (no silent skips)
        env:
          REQUIRE_NUMERIC_DEPS: '1'
        run: python -m unittest -v tests.test_small_squares_hunt_v242
