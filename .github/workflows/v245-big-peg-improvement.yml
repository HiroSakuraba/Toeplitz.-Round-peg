name: v245 certified rational Big Peg bound improvement

on:
  pull_request:
    paths:
      - 'code/big_peg_improvement_v245.py'
      - 'code/big_peg_search_v245.py'
      - 'tests/test_big_peg_improvement_v245.py'
      - 'research/v245-*'
      - '.github/workflows/v245-big-peg-improvement.yml'
  push:
    branches: [main]
    paths:
      - 'code/big_peg_improvement_v245.py'
      - 'code/big_peg_search_v245.py'
      - 'tests/test_big_peg_improvement_v245.py'
      - 'research/v245-*'
      - '.github/workflows/v245-big-peg-improvement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute exact maximum square and contained rational disk
        run: python code/big_peg_improvement_v245.py
      - name: Independent v223 complete geometric orbit crosscheck
        run: python code/big_peg_improvement_v245.py --crosscheck-v223
      - name: All new rational strict-margin and input tests
        run: python -m unittest -v tests.test_big_peg_improvement_v245

  search-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical-only candidate search dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Replay exploratory numerical scores (not a certificate)
        run: python code/big_peg_search_v245.py
