name: v247 true Big Peg ratio improvement certificate

on:
  pull_request:
    paths:
      - 'code/big_peg_true_ratio_v247.py'
      - 'code/big_peg_search_v247.py'
      - 'tests/test_big_peg_true_ratio_v247.py'
      - 'research/v247-*'
      - '.github/workflows/v247-big-peg-true-ratio.yml'
  push:
    branches: [main]
    paths:
      - 'code/big_peg_true_ratio_v247.py'
      - 'code/big_peg_search_v247.py'
      - 'tests/test_big_peg_true_ratio_v247.py'
      - 'research/v247-*'
      - '.github/workflows/v247-big-peg-true-ratio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rational-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute 20,000-chart square maxima and both global inradius covers
        run: python code/big_peg_true_ratio_v247.py
      - name: Independent old v223 exact geometric-square census
        run: python code/big_peg_true_ratio_v247.py --crosscheck-v223
      - name: Regression tests including strict true-ratio interval separation
        run: python -m unittest -v tests.test_big_peg_true_ratio_v247
      - name: Recheck prior v246 exact global enclosure
        run: python code/big_peg_inradius_v246.py

  numerical-search-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exploratory numpy dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Numerical-only baseline and new candidate comparison
        run: python code/big_peg_search_v247.py
      - name: Numerical-only one-grid-step search
        run: python code/big_peg_search_v247.py --start v245 --steps 1 --grid 12000
