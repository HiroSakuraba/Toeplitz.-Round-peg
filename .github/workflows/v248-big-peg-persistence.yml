name: v248 quantitative square persistence for rough curves

on:
  pull_request:
    paths:
      - 'code/big_peg_persistence_v248.py'
      - 'tests/test_big_peg_persistence_v248.py'
      - 'research/v248-*'
      - '.github/workflows/v248-big-peg-persistence.yml'
  push:
    branches: [main]
    paths:
      - 'code/big_peg_persistence_v248.py'
      - 'tests/test_big_peg_persistence_v248.py'
      - 'research/v248-*'
      - '.github/workflows/v248-big-peg-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute exact Brouwer fixed-point cube and rough-graph constants
        run: python code/big_peg_persistence_v248.py
      - name: Run universal graph-amplitude and negative-control tests
        run: python -m unittest -v tests.test_big_peg_persistence_v248
      - name: Ensure previous global inradius theorem still passes
        run: python code/big_peg_inradius_v246.py
      - name: Ensure previous certified true-ratio inequality still passes
        run: python code/big_peg_true_ratio_v247.py
