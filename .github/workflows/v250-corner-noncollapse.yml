name: v250 exact genuine corner and all-square noncollapse

on:
  pull_request:
    paths:
      - 'code/big_peg_corner_v250.py'
      - 'tests/test_big_peg_corner_v250.py'
      - 'research/v250-*'
      - '.github/workflows/v250-corner-noncollapse.yml'
  push:
    branches: [main]
    paths:
      - 'code/big_peg_corner_v250.py'
      - 'tests/test_big_peg_corner_v250.py'
      - 'research/v250-*'
      - '.github/workflows/v250-corner-noncollapse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-corner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact kink crossing, full Jordan family and feature-size theorem
        run: python code/big_peg_corner_v250.py
      - name: Genuine corner, every-square lower bound, and fixed-angle tooth controls
        run: python -m unittest -v tests.test_big_peg_corner_v250
      - name: Retain v249 exact collinear-subdivision two-chart theorem
        run: python code/big_peg_multichart_v249.py
      - name: Retain v248 rough graph perturbation square stability
        run: python code/big_peg_persistence_v248.py
