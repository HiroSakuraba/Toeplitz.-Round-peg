name: v251 exact size-aware multi-branch square atlas

on:
  pull_request:
    paths:
      - 'code/big_peg_size_atlas_v251.py'
      - 'tests/test_big_peg_size_atlas_v251.py'
      - 'research/v251-*'
      - '.github/workflows/v251-size-atlas.yml'
  push:
    branches: [main]
    paths:
      - 'code/big_peg_size_atlas_v251.py'
      - 'tests/test_big_peg_size_atlas_v251.py'
      - 'research/v251-*'
      - '.github/workflows/v251-size-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-size-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certify exact competing square-size event and high cutoff atlas
        run: python code/big_peg_size_atlas_v251.py
      - name: Test whole-time cover, polynomial crossover and negative cases
        run: python -m unittest -v tests.test_big_peg_size_atlas_v251
      - name: Retain genuine corner noncollapse theorem from v250
        run: python code/big_peg_corner_v250.py
      - name: Retain exact continuation predecessor from v249
        run: python code/big_peg_multichart_v249.py
