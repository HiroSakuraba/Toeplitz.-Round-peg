name: v253 relative parity and global maximum-square bottleneck

on:
  pull_request:
    paths:
      - 'code/big_peg_relative_parity_v253.py'
      - 'tests/test_big_peg_relative_parity_v253.py'
      - 'research/v253-*'
      - '.github/workflows/v253-relative-parity.yml'
  push:
    branches: [main]
    paths:
      - 'code/big_peg_relative_parity_v253.py'
      - 'tests/test_big_peg_relative_parity_v253.py'
      - 'research/v253-*'
      - '.github/workflows/v253-relative-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-relative-boundary-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove actual global maximum square-size envelope and corrected integer parity
        run: python code/big_peg_relative_parity_v253.py
      - name: Regression tests for algebraic minimax, derivative signs and boundary-flux conservation
        run: python -m unittest -v tests.test_big_peg_relative_parity_v253
      - name: Recheck 126-chart all-time complete high-square census
        run: python code/big_peg_cutoff_ledger_v252.py
      - name: Recheck predecessor all-time large-square existence
        run: python code/big_peg_size_atlas_v251.py
