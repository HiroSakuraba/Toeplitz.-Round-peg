name: v254 exact positive-square pair death at genuine polygon vertex

on:
  pull_request:
    paths:
      - 'code/big_peg_pair_death_v254.py'
      - 'tests/test_big_peg_pair_death_v254.py'
      - 'research/v254-*'
      - '.github/workflows/v254-square-pair-death.yml'
  push:
    branches: [main]
    paths:
      - 'code/big_peg_pair_death_v254.py'
      - 'tests/test_big_peg_pair_death_v254.py'
      - 'research/v254-*'
      - '.github/workflows/v254-square-pair-death.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-geometric-pair-death:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certify positive-size geometric pair annihilation for all real times
        run: python code/big_peg_pair_death_v254.py
      - name: Regress algebraic vertex event, independent unfiltered censuses and negative controls
        run: python -m unittest -v tests.test_big_peg_pair_death_v254
      - name: Retain predecessor v253 global size envelope and cutoff parity theorem
        run: python code/big_peg_relative_parity_v253.py
      - name: Retain predecessor v229 exact singular quotient germ checks
        run: python code/singular_continuation_v229.py
