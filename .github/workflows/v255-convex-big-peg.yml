name: v255 convex sharp Big Peg and hidden-corner lemma

on:
  pull_request:
    paths:
      - 'code/convex_big_peg_v255.py'
      - 'tests/test_convex_big_peg_v255.py'
      - 'research/v255-*'
      - '.github/workflows/v255-convex-big-peg.yml'
  push:
    branches: [main]
    paths:
      - 'code/convex_big_peg_v255.py'
      - 'tests/test_convex_big_peg_v255.py'
      - 'research/v255-*'
      - '.github/workflows/v255-convex-big-peg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact lemma grid, convex censuses and Pochuev hidden-corner certificate (standard library)
        run: python code/convex_big_peg_v255.py
      - name: Exact tests (numeric tests skip without numpy/scipy)
        run: python -m unittest -v tests.test_convex_big_peg_v255
      - name: Retain predecessor v244 Pochuev certificate
        run: python code/pochuev_big_peg_v244.py

  numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: All v255 tests with dependencies required (no silent skips)
        env:
          REQUIRE_NUMERIC_DEPS: '1'
        run: python -m unittest -v tests.test_convex_big_peg_v255
