name: v258 quantitative transverse near-square exact lifting

on:
  pull_request:
    paths:
      - 'code/near_square_transversality_v258.py'
      - 'tests/test_near_square_transversality_v258.py'
      - 'research/v258-*'
      - '.github/workflows/v258-near-square-lift.yml'
  push:
    branches: [main]
    paths:
      - 'code/near_square_transversality_v258.py'
      - 'tests/test_near_square_transversality_v258.py'
      - 'research/v258-*'
      - '.github/workflows/v258-near-square-lift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-near-square-lift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove the exact conditioned polygon square-lift and nonconvex example
        run: python code/near_square_transversality_v258.py
      - name: Quantitative transversality, v223 independent census and negative controls
        run: python -m unittest -v tests.test_near_square_transversality_v258
      - name: Recheck v256-v257 symmetry and near-square witnesses
        run: python code/central_symmetry_square_v256.py
      - name: Recheck v248 rough normal-graph persistence theorem
        run: python code/big_peg_persistence_v248.py
