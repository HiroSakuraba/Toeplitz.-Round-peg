name: v259 exact local degree across polygon corner

on:
  pull_request:
    paths:
      - 'code/square_degree_cube_v259.py'
      - 'tests/test_square_degree_cube_v259.py'
      - 'research/v259-*'
      - '.github/workflows/v259-square-degree.yml'
  push:
    branches: [main]
    paths:
      - 'code/square_degree_cube_v259.py'
      - 'tests/test_square_degree_cube_v259.py'
      - 'research/v259-*'
      - '.github/workflows/v259-square-degree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-local-square-degree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certify 4D Poincare-Miranda face signs and arbitrary C0 perturbation
        run: python code/square_degree_cube_v259.py
      - name: Regress exact degree, kink, independent v223 census and negative cases
        run: python -m unittest -v tests.test_square_degree_cube_v259
      - name: Replay v250 genuine moving noncollinear corner and feature-size checks
        run: python code/big_peg_corner_v250.py
      - name: Replay v258 conditional near-square exact lift
        run: python code/near_square_transversality_v258.py
