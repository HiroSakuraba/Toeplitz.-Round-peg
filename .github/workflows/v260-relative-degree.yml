name: v260 exact relative Brouwer degree and square pair-death gluing

on:
  pull_request:
    paths:
      - 'code/square_relative_degree_v260.py'
      - 'tests/test_square_relative_degree_v260.py'
      - 'research/v260-*'
      - '.github/workflows/v260-relative-degree.yml'
  push:
    branches: [main]
    paths:
      - 'code/square_relative_degree_v260.py'
      - 'tests/test_square_relative_degree_v260.py'
      - 'research/v260-*'
      - '.github/workflows/v260-relative-degree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-relative-degree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact all-time outer-boundary nonvanishing and relative degree
        run: python code/square_relative_degree_v260.py
      - name: Verify algebraic root gluing, signed cancellation and negative cases
        run: python -m unittest -v tests.test_square_relative_degree_v260
      - name: Retain v254 positive-size geometric pair-death theorem
        run: python code/big_peg_pair_death_v254.py
      - name: Retain v259 nonzero-degree local square persistence example
        run: python code/square_degree_cube_v259.py
