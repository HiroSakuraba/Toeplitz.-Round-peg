name: v262 exact cyclic quotient relative mod2 degree

on:
  pull_request:
    paths:
      - 'code/square_quotient_parity_v262.py'
      - 'tests/test_square_quotient_parity_v262.py'
      - 'research/v262-*'
      - '.github/workflows/v262-quotient-parity.yml'
  push:
    branches: [main]
    paths:
      - 'code/square_quotient_parity_v262.py'
      - 'tests/test_square_quotient_parity_v262.py'
      - 'research/v262-*'
      - '.github/workflows/v262-quotient-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-cyclic-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certify eight cyclic regions and Z2 quotient degree through genuine vertex gluing
        run: python code/square_quotient_parity_v262.py
      - name: Exact C4 equivariance, orbit parity and negative controls
        run: python -m unittest -v tests.test_square_quotient_parity_v262
      - name: Retain oriented atlas, pair death and quotient obstruction
        run: python -m unittest -v tests.test_square_oriented_atlas_v261 tests.test_square_relative_degree_v260
