name: v264 reusable convex square event ledger

on:
  pull_request:
    paths:
      - 'code/convex_square_event_atlas_v264.py'
      - 'tests/test_convex_square_event_atlas_v264.py'
      - 'research/v264-*'
      - '.github/workflows/v264-convex-atlas.yml'
  push:
    branches: [main]
    paths:
      - 'code/convex_square_event_atlas_v264.py'
      - 'tests/test_convex_square_event_atlas_v264.py'
      - 'research/v264-*'
      - '.github/workflows/v264-convex-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-convex-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reusable moving convex polygon event ledger example
        run: python code/convex_square_event_atlas_v264.py
      - name: Exact rational nonpentagon, refinement, event and fail-closed tests
        run: python -m unittest -v tests.test_convex_square_event_atlas_v264
      - name: Preserve full v263 complete-time pentagon and v262 quotient guarantees
        run: python -m unittest -v tests.test_pentagon_complete_ledger_v263 tests.test_square_quotient_parity_v262
