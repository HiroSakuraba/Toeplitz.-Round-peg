name: v267 secant spin and rectangle obstruction audit

on:
  pull_request:
    paths:
      - 'code/secant_spin_rectangle_v267.py'
      - 'tests/test_secant_spin_rectangle_v267.py'
      - 'research/v267-*'
      - '.github/workflows/v267-secant-spin.yml'
  push:
    branches: [main]
    paths:
      - 'code/secant_spin_rectangle_v267.py'
      - 'tests/test_secant_spin_rectangle_v267.py'
      - 'research/v267-*'
      - '.github/workflows/v267-secant-spin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-secant-chirality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Universal secant-spin, D4 obstruction, rectangle crossing, shrinkout
        run: python code/secant_spin_rectangle_v267.py
      - name: Exact rational secant-winding and square-diagonal regression tests
        run: python -m unittest -v tests.test_secant_spin_rectangle_v267
      - name: Preserve v218-v219 source orientation and collision tests
        run: python -m unittest -v tests.test_configuration_symmetry_v218 tests.test_collision_quotient_v219
