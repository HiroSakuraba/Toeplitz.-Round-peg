name: v269-v273 relative rectangle exact models

on:
  push:
    paths:
      - 'code/relative_rectangle_v269_v273.py'
      - 'tests/test_relative_rectangle_v269_v273.py'
      - 'research/v269-relative-index-ellipse-stability.md'
      - 'research/v270-spectral-axiom-no-go.md'
      - 'research/v271-six-sector-equivariant-ledger.md'
      - 'research/v272-degeneration-trichotomy-and-shrinkout.md'
      - 'research/v273-ellipse-angle-continuation.md'
      - '.github/workflows/v269-v273-relative-rectangle.yml'
  pull_request:
    paths:
      - 'code/relative_rectangle_v269_v273.py'
      - 'tests/test_relative_rectangle_v269_v273.py'
      - 'research/v269-relative-index-ellipse-stability.md'
      - 'research/v270-spectral-axiom-no-go.md'
      - 'research/v271-six-sector-equivariant-ledger.md'
      - 'research/v272-degeneration-trichotomy-and-shrinkout.md'
      - 'research/v273-ellipse-angle-continuation.md'
      - '.github/workflows/v269-v273-relative-rectangle.yml'
  workflow_dispatch:

jobs:
  exact-tranche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact five-lane regression
        run: python -m unittest discover -s tests -p 'test_relative_rectangle_v269_v273.py' -v
      - name: Exact certificate summary
        run: python code/relative_rectangle_v269_v273.py