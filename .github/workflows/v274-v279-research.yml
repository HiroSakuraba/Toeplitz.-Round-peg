name: v274–v279 rectangle atlas and controls

on:
  pull_request:
    paths:
      - 'code/*v27[4-9].py'
      - 'code/polygon_orbit_census_v223.py'
      - 'code/moving_polygon_events_v224.py'
      - 'tests/*v27[4-9].py'
      - 'research/v27[4-9]*'
      - 'results/v274/**'
      - 'results/v278/**'
      - '.github/workflows/v274-v279-research.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the full atlas and cross-check exact geometry
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --workdir /work --env PYTHONDONTWRITEBYTECODE=1 --entrypoint /usr/bin/sage \
            sagemath/sagemath:10.10 -c \
            "import unittest; suite = unittest.defaultTestLoader.discover('tests', pattern='test_rectangle_atlas_v274.py'); assert unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful()"
  relative-and-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the relative class, primitive controls, and falsifiers
        run: |
          python -m unittest discover -s tests -p 'test_*v27[568].py' -v
          python code/adversarial_rectangles_v278.py --check
