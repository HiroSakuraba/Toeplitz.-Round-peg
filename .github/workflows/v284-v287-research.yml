name: v284–v287 rectangle family stability

on:
  pull_request:
    paths:
      - 'code/protected_rectangle_band_v284.py'
      - 'code/moving_spiral_support_v285_v286.py'
      - 'code/relative_witness_refinement_v282_v283.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'tests/test_rectangle_family_stability_v284_v287.py'
      - 'tests/test_support_identities_v285.py'
      - 'research/v284-v287*'
      - 'results/v284-v287/**'
      - '.github/workflows/v284-v287-research.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angle-band-and-collars:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the exact certificates and bent-arc fixtures
        run: |
          python -m unittest discover -s tests -p 'test_rectangle_family_stability_v284_v287.py' -v
          python code/protected_rectangle_band_v284.py --check
          python code/moving_spiral_support_v285_v286.py --check
  moving-support-algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check the moving support equations with SageMath
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --workdir /work --env PYTHONDONTWRITEBYTECODE=1 --entrypoint /usr/bin/sage \
            sagemath/sagemath:10.10 -c \
            "import unittest; suite = unittest.defaultTestLoader.discover('tests', pattern='test_support_identities_v285.py'); assert unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful()"
