name: v288–v291 rough-arc continuation

on:
  pull_request:
    paths:
      - 'code/rough_arc_continuation_v288_v291.py'
      - 'code/protected_rectangle_band_v284.py'
      - 'code/moving_polygon_events_v224.py'
      - 'code/big_peg_multichart_v249.py'
      - 'tests/test_rough_arc_*.py'
      - 'research/v288-v291*'
      - 'results/v280/moving-concave-atlas.json'
      - 'results/v288-v291/**'
      - '.github/workflows/v288-v291-research.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coupled-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay the rough arc and coupled tent certificates
        run: |
          python -m unittest discover -s tests -p 'test_rough_arc_continuation_v288_v291.py' -v
          python code/rough_arc_continuation_v288_v291.py --check
  algebraic-joins:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify both patch lifts and their joins with SageMath
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --workdir /work --env PYTHONDONTWRITEBYTECODE=1 --entrypoint /usr/bin/sage \
            sagemath/sagemath:10.10 -c \
            "import unittest; suite = unittest.defaultTestLoader.discover('tests', pattern='test_rough_arc_algebra_v288_v289.py'); assert unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful()"
