name: v296–v299 rough flat contacts

on:
  pull_request:
    paths:
      - 'code/rough_flat_contacts_v296_v299.py'
      - 'code/moving_flat_endpoints_v292_v295.py'
      - 'tests/test_rough_flat_contacts_v296_v299.py'
      - 'tests/test_rough_flat_algebra_v296.py'
      - 'research/v296-v299*'
      - 'results/v296-v299/**'
      - '.github/workflows/v296-v299-research.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaled-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay the degree bounds, coil error and cubic control
        run: |
          python -m unittest discover -s tests -p 'test_rough_flat_contacts_v296_v299.py' -v
          python code/rough_flat_contacts_v296_v299.py --check
  endpoint-algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Independently derive the parabolic limit with SageMath
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --workdir /work --env PYTHONDONTWRITEBYTECODE=1 --entrypoint /usr/bin/sage \
            sagemath/sagemath:10.10 -c \
            "import unittest; suite = unittest.defaultTestLoader.discover('tests', pattern='test_rough_flat_algebra_v296.py'); assert unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful()"
