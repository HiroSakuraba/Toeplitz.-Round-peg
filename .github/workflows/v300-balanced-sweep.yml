name: v300 bounded-density square crossing
on:
  pull_request:
    paths:
      - 'code/balanced_sweep_v300.py'
      - 'tests/test_balanced_sweep_v300.py'
      - 'results/v300/**'
      - 'research/v300-bounded-density-square-crossing.md'
      - '.github/workflows/v300-balanced-sweep.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check interval roots, sweep gates and exact certificate
        run: |
          python -m unittest discover -s tests -p 'test_balanced_sweep_v300.py' -v
          python code/balanced_sweep_v300.py --check
