name: v302-v303 rough crossing and directions
on:
  pull_request:
    paths:
      - 'code/rough_crossing_v302.py'
      - 'code/direction_search_v303.py'
      - 'code/tilted_sweep_v301.py'
      - 'code/balanced_sweep_v300.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'research/v302-connected-rough-rectangle-crossing.md'
      - 'research/v303-finding-a-direction.md'
      - 'results/v302/**'
      - 'results/v303/**'
      - 'tests/test_rough_crossing_v302.py'
      - 'tests/test_direction_search_v303.py'
      - '.github/workflows/v302-v303-rough-crossing.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact margins, endpoint rectangles and direction certificates
        run: |
          python -m unittest discover -s tests -p 'test_rough_crossing_v302.py' -v
          python -m unittest discover -s tests -p 'test_direction_search_v303.py' -v
          python code/rough_crossing_v302.py --check
          python code/direction_search_v303.py --check
