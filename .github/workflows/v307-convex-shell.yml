name: v307 convex shell square gap
on:
  pull_request:
    paths:
      - 'code/convex_shell_v307.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'research/v307-convex-shell-square-gap.md'
      - 'tests/test_convex_shell_v307.py'
      - 'results/v307/**'
      - '.github/workflows/v307-convex-shell.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_convex_shell_v307.py' -v
      - run: python code/convex_shell_v307.py | diff - results/v307/convex-shell.json
