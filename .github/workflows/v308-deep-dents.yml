name: v308 deep dents and cell parity
on:
  pull_request:
    paths:
      - 'code/deep_dents_v308.py'
      - 'code/deep_dent_census_v308.py'
      - 'code/convex_shell_v307.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'research/v308-deep-dents-and-square-parity.md'
      - 'tests/test_deep_dents_v308.py'
      - 'results/v308/**'
      - '.github/workflows/v308-deep-dents.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_deep_dents_v308.py' -v
      - run: python code/deep_dents_v308.py | diff - results/v308/deep-dents.json
      - name: Compare independent square censuses with the predicted parities
        run: |
          for kind in opposite_dents two_runs three_runs; do
            python code/deep_dent_census_v308.py "$kind" | diff - "results/v308/census-$kind.json"
          done
