name: v309 localized square degree
on:
  pull_request:
    paths:
      - 'code/center_walls_v309.py'
      - 'code/deep_dents_v308.py'
      - 'code/convex_shell_v307.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'research/v309-local-square-degree-by-center.md'
      - 'tests/test_center_walls_v309.py'
      - 'results/v309/**'
      - '.github/workflows/v309-center-walls.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_center_walls_v309.py' -v
      - run: python code/center_walls_v309.py | diff - results/v309/center-walls.json
