name: v312 rough arc winding
on:
  pull_request:
    paths:
      - 'code/rough_arc_winding_v312.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'research/v312-two-arc-winding.md'
      - 'tests/test_rough_arc_winding_v312.py'
      - 'results/v312/**'
      - '.github/workflows/v312-rough-arc-winding.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_rough_arc_winding_v312.py' -v
      - run: python code/rough_arc_winding_v312.py | diff - results/v312/rough-arc-winding.json
