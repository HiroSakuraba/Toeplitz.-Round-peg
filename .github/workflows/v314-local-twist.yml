name: v314 local square degree
on:
  pull_request:
    paths:
      - 'code/half_turn_degree_v313.py'
      - 'code/local_twist_v314.py'
      - 'code/rough_arc_winding_v312.py'
      - 'code/boundary_or_winding_v313.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'research/v314-local-twist.md'
      - 'tests/test_local_twist_v314.py'
      - 'results/v314/**'
      - '.github/workflows/v314-local-twist.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_local_twist_v314.py' -v
      - run: python code/local_twist_v314.py | diff - results/v314/local-twist.json
