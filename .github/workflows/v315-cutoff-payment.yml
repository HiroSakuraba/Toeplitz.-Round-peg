name: v315 cutoff payment
on:
  pull_request:
    paths:
      - 'code/half_turn_degree_v313.py'
      - 'code/cutoff_payment_v315.py'
      - 'code/rough_arc_winding_v312.py'
      - 'code/boundary_or_winding_v313.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'research/v315-cutoff-payment.md'
      - 'tests/test_cutoff_payment_v315.py'
      - 'results/v315/**'
      - '.github/workflows/v315-cutoff-payment.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_cutoff_payment_v315.py' -v
      - run: python code/cutoff_payment_v315.py | diff - results/v315/cutoff-payment.json
