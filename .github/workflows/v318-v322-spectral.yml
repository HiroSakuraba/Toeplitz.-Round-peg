name: v318-v322 spectral negative controls
on:
  pull_request:
    paths:
      - 'code/spectral_noncollapse_v318_v322.py'
      - 'tests/test_spectral_noncollapse_v318_v322.py'
      - 'research/v318-v322-support-free-spectral.md'
      - '.github/workflows/v318-v322-spectral.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_spectral_noncollapse_v318_v322.py' -v
      - run: python code/spectral_noncollapse_v318_v322.py
