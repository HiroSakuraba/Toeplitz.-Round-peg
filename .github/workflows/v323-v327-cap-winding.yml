name: v323-v327 cap winding controls
on:
  pull_request:
    paths:
      - 'code/cap_winding_v323_v327.py'
      - 'tests/test_cap_winding_v323_v327.py'
      - 'research/v323-v327-cap-winding.md'
      - '.github/workflows/v323-v327-cap-winding.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_cap_winding_v323_v327.py' -v
      - run: python code/cap_winding_v323_v327.py
