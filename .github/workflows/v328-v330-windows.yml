name: v328-v330 angular windows, ellipses and spirals
on:
  pull_request:
    paths:
      - 'code/angular_windows_v328_v330.py'
      - 'tests/test_angular_windows_v328_v330.py'
      - 'research/v328-v330-windows-ellipses-spirals.md'
      - 'results/v328-v330/**'
      - '.github/workflows/v328-v330-windows.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_angular_windows_v328_v330.py' -v
      - run: python code/angular_windows_v328_v330.py | diff - results/v328-v330/windows-ellipses-spirals.json
