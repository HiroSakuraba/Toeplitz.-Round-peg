name: v331 residue census
on:
  pull_request:
    paths:
      - 'code/residue_census_v331.py'
      - 'code/floer_parity_v331.py'
      - 'code/floer_actions_v331.py'
      - 'code/floer_grading_v331.py'
      - 'tests/test_floer_grading_v331.py'
      - 'tests/test_floer_actions_v331.py'
      - 'tests/test_floer_parity_v331.py'
      - 'code/angular_windows_v328_v330.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'tests/test_residue_census_v331.py'
      - 'research/v331-residue-census.md'
      - 'results/v331/**'
      - '.github/workflows/v331-residue-census.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python -m unittest discover -s tests -p 'test_residue_census_v331.py' -v
        env:
          REQUIRE_NUMERIC_DEPS: '1'
      - run: python -m unittest discover -s tests -p 'test_floer_parity_v331.py' -v
        env:
          REQUIRE_NUMERIC_DEPS: '1'
      - run: python code/residue_census_v331.py | diff - results/v331/census.json
      - run: python -m unittest discover -s tests -p 'test_floer_actions_v331.py' -v
        env:
          REQUIRE_NUMERIC_DEPS: '1'
      - run: python code/floer_parity_v331.py | diff - results/v331/parity.json
      - run: python -m unittest discover -s tests -p 'test_floer_grading_v331.py' -v
        env:
          REQUIRE_NUMERIC_DEPS: '1'
      - run: python code/floer_actions_v331.py | diff - results/v331/actions.json
      - run: python code/floer_grading_v331.py | diff - results/v331/grading.json
