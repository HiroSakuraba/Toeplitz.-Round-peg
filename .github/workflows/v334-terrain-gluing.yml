name: v334 two-terrain gluing
on:
  pull_request:
    paths:
      - 'code/terrain_gluing_v334.py'
      - 'code/residue_census_v331.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'tests/test_terrain_gluing_v334.py'
      - 'research/v334-two-terrain-gluing.md'
      - 'results/v334/**'
      - '.github/workflows/v334-terrain-gluing.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python -m unittest discover -s tests -p 'test_terrain_gluing_v334.py' -v
        env:
          REQUIRE_NUMERIC_DEPS: '1'
      - run: python code/terrain_gluing_v334.py | diff - results/v334/witnesses.json
