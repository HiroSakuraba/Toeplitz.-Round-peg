name: v337 terrain component degree
on:
  pull_request:
    paths:
      - 'code/terrain_component_degree_v337.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'tests/test_terrain_component_degree_v337.py'
      - 'research/v337-terrain-component-degree.md'
      - '.github/workflows/v337-terrain-component-degree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'sympy==1.14.0'
      - run: python -m unittest discover -s tests -p 'test_terrain_component_degree_v337.py' -v
