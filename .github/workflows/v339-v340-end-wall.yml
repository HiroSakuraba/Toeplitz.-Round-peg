name: v339-v340 end-wall certificates
on:
  pull_request:
    paths:
      - 'code/terrain_selector_v339.py'
      - 'code/terrain_component_degree_v337.py'
      - 'code/robust_parity_v338.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'research/v339-v340-end-wall-selection.md'
      - 'results/v340/**'
      - 'tests/test_terrain_selector_v339_v340.py'
      - '.github/workflows/v339-v340-end-wall.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'sympy==1.14.0' 'numpy>=1.26,<3'
      - run: python -m unittest discover -s tests -p 'test_terrain_selector_v339_v340.py' -v
