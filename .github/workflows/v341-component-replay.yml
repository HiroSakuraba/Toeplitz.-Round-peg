name: v341 component certificates
on:
  pull_request:
    paths:
      - 'code/*v341.py'
      - 'code/polygon_orbit_census_v223.py'
      - 'code/terrain_component_degree_v337.py'
      - 'research/v341-ledge-and-component-certificates.md'
      - 'results/v341/**'
      - 'results/v340/end-wall.csv'
      - 'tests/test_terrain_component_v341.py'
      - '.github/workflows/v341-component-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python -m unittest discover -s tests -p 'test_terrain_component_v341.py' -v
